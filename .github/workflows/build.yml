# Push/PR: сборка на проверку (репо публичный, минуты бесплатные).
# Тег bfN: та же сборка + GitHub Release с jar'ом `<имя>-bfN.jar`; пак закрепляет его
# командой scripts/bump-fork.sh <мод> bfN в blockfield-modpack.
name: Build
on:
  push:
    branches: [main]
    tags: ["bf[0-9]*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21.0.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
      - name: Cache pinned project tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/quality
            .dev/jdk
          key: quality-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('scripts/toolchain.py', 'scripts/quality.py', 'dev/quality.py') }}
      - run: python -I -X utf8 scripts/toolchain.py --ci
      # v6 bundles proprietary caching under Gradle's Terms of Use; setup-gradle also validates wrappers by default.
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify JVM lint and regression tests, then build
        run: just build
      - name: Run headless GameTests
        timeout-minutes: 10
        run: |
          timeout 9m ./gradlew runGametestServer --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2G
          just python - <<'PYTEST'
          import xml.etree.ElementTree as ET
          report = ET.parse("build/gametest-results.xml").getroot()
          cases = report.findall(".//testcase")
          create_cases = [case for case in cases if case.get("classname", "").startswith("create:")]
          assert len(create_cases) >= 66 and len(cases) >= 67, "Expected 66 Create GameTests plus the Porting Lib smoke test"
          assert not report.findall(".//failure") + report.findall(".//error"), "GameTests reported failures"
          assert not report.findall(".//skipped"), "GameTests were skipped"
          print(f"{len(cases)} GameTests passed")
          PYTEST
      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: JVM test reports
          path: |
            build/gametest-results.xml
            build/gametest/logs/
            build/gametest/crash-reports/
            build/reports/tests/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: Release the jar under the tag
        if: startsWith(github.ref, 'refs/tags/bf')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          jars=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-javadoc.jar')
          [ "$(printf '%s\n' "$jars" | wc -l)" -eq 1 ] || { echo "ожидался один jar, есть: $jars"; exit 1; }
          out="${jars%.jar}-$GITHUB_REF_NAME.jar"
          mv "$jars" "$out"
          test -f "release-notes/$GITHUB_REF_NAME.md" || { echo "missing release-notes/$GITHUB_REF_NAME.md: prepare it in the release PR"; exit 1; }
          just python scripts/release-notes-tool.py "release-notes/$GITHUB_REF_NAME.md" \
            --repository Blockfield/create-fabric --version "$GITHUB_REF_NAME"
          cp "release-notes/$GITHUB_REF_NAME.md" release-notes.md
          gh release create "$GITHUB_REF_NAME" "$out" release-notes.md --title "$(basename "$out" .jar)" --notes-file release-notes.md
